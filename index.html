<style>
  :root{
    --cream:#ecd5ce; --paper:#f8e1da; --peach:#d8aa9f; --peach-d:#a2685d;
    --sage:#d9b6ac; --sage-d:#a77568; --lav:#e3c6c4; --sky:#ead0c9;
    --ink:#7c5149; --ink-soft:#a07e76; --gold:#b98b7c;
    --radius:14px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:'Jost','Prompt',serif; color:var(--ink);
    background:radial-gradient(circle at 20% 15%,#fbf3c4 0,transparent 45%),radial-gradient(circle at 85% 30%,#d6ecf3 0,transparent 45%),radial-gradient(circle at 25% 85%,#f8d6d2 0,transparent 50%),radial-gradient(circle at 80% 90%,#dff0e2 0,transparent 45%),#fbf7ef;
    min-height:100%; overflow:hidden;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    -webkit-tap-highlight-color:transparent;
  }
  .script{font-family:'Jost','Prompt',serif;font-weight:400}
  html[lang=en] .script{font-family:'Jost',sans-serif;font-style:normal;font-weight:300;letter-spacing:.5px}

  /* language toggle */
  .lang{position:fixed;top:14px;right:14px;z-index:50;display:flex;background:rgba(255,255,255,.4);
    border:1px solid #dcb5ab;border-radius:999px;padding:3px;}
  .lang button{border:0;background:transparent;font:600 13px 'Prompt',sans-serif;color:var(--ink-soft);
    padding:6px 12px;border-radius:999px;cursor:pointer;letter-spacing:.5px}
  .lang button.on{background:var(--peach-d);color:#fff}

  /* petals: drift over the card */
  .petal{position:fixed;top:0;left:0;pointer-events:none;z-index:40;will-change:transform;animation:fall linear infinite}
  .petal i{display:block;width:100%;height:100%;background-position:center;background-size:contain;background-repeat:no-repeat;opacity:.85;
    will-change:transform;animation:sway ease-in-out infinite alternate}
  @keyframes fall{from{transform:translate3d(0,-60px,0)}to{transform:translate3d(var(--dx,40px),calc(100vh + 60px),0)}}
  @keyframes sway{from{transform:translateX(-18px) rotate(-40deg)}to{transform:translateX(18px) rotate(220deg)}}
  @media (prefers-reduced-motion:reduce){.petal{display:none}}

  .page::after{content:"";position:absolute;left:0;top:0;bottom:0;width:18px;
    background:linear-gradient(90deg,rgba(124,81,73,.08),transparent);pointer-events:none}
  .inner{font-family:'Jost','Prompt',sans-serif;font-weight:300;position:relative;z-index:1;flex:1;overflow-y:auto;padding:34px 26px 30px;-webkit-overflow-scrolling:touch}
  .inner::-webkit-scrollbar{width:0}

  /* cover */
  .cover{}
  .cover .inner{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px}
  .cover .kicker{font:600 13px 'Prompt';letter-spacing:1px;text-transform:uppercase;color:var(--sage-d)}
  html[lang=en] .cover .kicker{letter-spacing:4px;font-size:12px}
  body{padding-top:46px}
  .cover h1{font-size:36px;line-height:1.25;font-weight:500;color:var(--peach-d)}
  .cover .amp{display:block;font-size:30px;color:var(--gold);margin:2px 0}
  .cover .date{font-family:'Jost',serif;font-size:30px;letter-spacing:6px;color:var(--ink)}
  .cover .day{font-size:15px;color:var(--ink-soft)}
  .cover .place{font-size:15px;color:var(--ink-soft)}
  .tap{margin-top:14px;font-size:13px;color:var(--sage-d);animation:pulse 2s ease-in-out infinite}
  @keyframes pulse{50%{opacity:.4}}
  .wreath{width:150px;height:150px}

  /* section headings */
  .head{text-align:center;margin-bottom:20px}
  .head .num{font:500 11px 'Jost';letter-spacing:5px;color:var(--ink-soft)}
  .head h2{font-size:22px;color:var(--ink);font-weight:500;margin-top:4px;letter-spacing:1px}
  html[lang=en] .head h2{font-style:normal;text-transform:uppercase;letter-spacing:5px;font-size:19px}
  .head p{font-family:'Jost','Prompt';font-size:13px;color:var(--ink-soft);margin-top:4px}
  .divider{display:flex;align-items:center;justify-content:center;gap:8px;margin:10px 0 0;color:var(--gold);font-size:10px}
  .divider span{height:1px;width:46px;background:linear-gradient(90deg,transparent,var(--gold))}
  .divider span:last-child{transform:scaleX(-1)}

  /* venue */
  .venue{padding:14px !important;background:rgba(255,255,255,.55);border:1px solid #e6c4bb;border-radius:18px;padding:18px;text-align:center;margin-bottom:22px}
  .venue h3{font-size:16px;font-weight:600}
  .venue p{font-size:14px;color:var(--ink-soft);margin-top:4px}
  .btn{display:inline-flex;align-items:center;gap:6px;margin-top:12px;padding:9px 20px;border-radius:999px;letter-spacing:1px;
    background:var(--peach-d);color:#fff;text-decoration:none;font:600 13px 'Prompt';border:0;cursor:pointer}
  .btn.ghost{background:transparent;color:var(--sage-d);border:1px solid var(--sage)}
  .timeline{position:relative;padding-left:26px}
  .timeline::before{content:"";position:absolute;left:8px;top:6px;bottom:6px;width:2px;
    background:#dcb5ab}
  .tl{position:relative;margin-bottom:18px}
  .tl::before{content:"";position:absolute;left:-23px;top:5px;width:12px;height:12px;border-radius:50%;
    background:var(--paper);border:2px solid var(--peach-d)}
  .tl:nth-child(2)::before{border-color:var(--sage)}
  .tl:nth-child(3)::before{border-color:var(--lav)}
  .tl:nth-child(4)::before{border-color:var(--sky)}
  .tl .time{font-family:'Jost','Prompt',serif;font-size:19px;font-weight:600;color:var(--peach-d);letter-spacing:1px}
  .tl .what{font-size:15px;font-weight:600}
  .tl .note{font-size:13px;color:var(--ink-soft)}
  .dress{margin-top:6px;text-align:center;font-size:13px;color:var(--ink-soft)}
  .swatches{display:flex;justify-content:center;gap:8px;margin-top:8px}
  .swatches i{width:22px;height:22px;border-radius:50%;border:2px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.12)}

  /* cards */
  .card{background:rgba(255,255,255,.58);border:1px solid #e6c4bb;border-radius:16px;padding:14px 16px;margin-bottom:12px;
    box-shadow:none}
  .card .top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
  .card h4{font-family:'Jost','Prompt',serif;font-size:15px;font-weight:500;line-height:1.3}
  .card .tag{flex-shrink:0;font-size:11px;font-weight:600;padding:3px 9px;border-radius:999px;background:transparent;border:1px solid #d9b0a5;color:var(--peach-d)}
  .card .tag.price{background:transparent;border:1px solid #d9b0a5;color:var(--peach-d)}
  .card .tag.sweet{background:transparent;border:1px solid #d9b0a5;color:var(--peach-d)}
  .card .tag.temple{background:transparent;border:1px solid #d9b0a5;color:var(--peach-d)}
  .card .tag.sight{background:transparent;border:1px solid #d9b0a5;color:var(--peach-d)}
  .card p{font-size:13px;color:var(--ink-soft);margin-top:6px;line-height:1.5}
  .card .meta{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;font-size:13px}
  .card .meta a{color:var(--sage-d);text-decoration:none;font-weight:600}
  .card .meta span{color:var(--ink)}
  .fine{font-size:11.5px;color:var(--ink-soft);text-align:center;margin-top:10px;line-height:1.5}

  /* closing */
  .closing .inner{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:12px}
  .closing h2{font-size:28px;color:var(--ink)}
  .closing p{font-size:15px;color:var(--ink-soft);line-height:1.7;max-width:320px}

  .card .ph{margin:-14px -16px 10px;max-height:96px;border-radius:16px 16px 0 0;overflow:hidden;line-height:0}
  .card .ph svg{width:100%;height:96px;display:block;filter:grayscale(1) sepia(.45) hue-rotate(-28deg) saturate(1.25) brightness(1.04) contrast(.85)}
  .sub{font-size:16px;color:var(--peach-d);text-align:center;margin:22px 0 12px}
  .venue .lbl{font-size:12px;font-weight:600;color:var(--sage-d);letter-spacing:.5px;margin-bottom:6px}
  .venue .alt{font-size:13px;color:var(--ink-soft);font-style:italic}
  .mono{width:190px;height:auto;display:block}
  .invite{text-align:center;margin-bottom:20px}
  .invite .parents{display:flex;justify-content:center;align-items:center;gap:10px;font-size:13.5px;font-weight:600;flex-wrap:wrap}
  .invite .parents em{font-style:normal;color:var(--gold);font-weight:400}
  .invite p{white-space:pre-line;font-size:14px;color:var(--ink-soft);margin:10px auto 8px;max-width:none;line-height:1.6}
  .invite .couple{font-size:19px;color:var(--ink);font-weight:500;line-height:1.3}
  .invite .and{font-size:14px;color:var(--gold);margin:2px 0}
  .invite .when{font-weight:600;color:var(--ink)}
  .map svg{width:100%;height:auto;display:block;border-radius:16px;box-shadow:0 4px 14px rgba(200,160,150,.12)}
  .map a text{cursor:pointer}
  .legend{margin-top:14px;display:grid;gap:7px}
  .legend a{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);font-size:13px;
    background:rgba(255,255,255,.58);border:1px solid #e6c4bb;border-radius:12px;padding:8px 10px}
  .legend b{flex-shrink:0;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:11px;color:#fff}
  .legend small{margin-left:auto;color:var(--sage-d);font-weight:600}
  .emboss{position:absolute;pointer-events:none;z-index:0}
  .emboss.big{right:-6px;bottom:-14px;width:62%;height:auto}
  .emboss.small{right:-22px;top:-30px;width:30%;height:auto;opacity:.95}
  .cv{max-width:86%;align-self:flex-start;position:relative;z-index:1;display:flex;flex-direction:column;justify-content:center;height:100%;padding:10px 4px;text-align:left;color:var(--ink)}
  .cv .sm{font:500 11px 'Jost','Prompt';letter-spacing:3.5px;text-transform:uppercase;line-height:1.7;color:var(--ink-soft)}
  html[lang=th] .cv .sm{letter-spacing:1px;font-size:12.5px;font-family:'Prompt'}
  .cv .nm{font:58px 'Pinyon Script','Prompt',cursive;letter-spacing:0;line-height:1.05;color:var(--ink)}
  html[lang=th] .cv .nm{font-family:'Prompt';font-weight:200;letter-spacing:4px;font-size:40px}
  .cv .and{font:32px 'Pinyon Script','Prompt',cursive;color:var(--peach-d);margin:0 0 0 34px}
  html[lang=th] .cv .and{font:300 16px 'Prompt';margin:2px 0 2px 4px}
  .cv .gap{height:26px}
  html[lang=en] .cv .gap{height:16px!important}
  html[lang=en] .cv .sm{letter-spacing:2.5px}
  .cv .tap{text-align:left;margin-top:30px;color:var(--ink-soft)}
  .cv .fullnames{font:400 12.5px 'Prompt';color:var(--ink-soft);margin-top:10px;letter-spacing:.3px}
  .cv .script2{font:24px 'Pinyon Script',cursive;color:var(--peach-d);margin-top:22px}
  html[lang=th] .cv .script2{font:500 15px 'Prompt'}
  .card h4 small.th{display:block;font:300 12px 'Prompt';color:var(--ink-soft);margin-top:2px}
  .card.row{display:flex;gap:12px;align-items:flex-start;padding:12px}
  .card .body{flex:1;min-width:0}

  .rc-b{display:block;text-align:center;padding:10px;border-radius:999px;border:1px solid var(--peach-d);color:var(--peach-d);text-decoration:none;font:500 14px 'Prompt',sans-serif;background:#fff}
  .rc-b.rc-alt{border:0;background:none;padding:4px;font-size:12.5px;text-decoration:underline;opacity:.85}
  .rc-skip{border:0;background:none;color:var(--ink-soft);font:400 13px 'Prompt',sans-serif;cursor:pointer;padding:4px}
  /* mobile spacing around RSVP */
  .p-inv .rsvp-btn{margin:14px auto 14px !important}
  .p-inv .sc{width:44px;height:44px}
  .p-inv .sc svg{width:32px;height:32px}
  .p-inv .sicons::before{top:22px}
  .p-inv .si .st{margin-top:4px;font-size:12.5px}
  .p-inv .si .sw{font-size:12px}
  .p-inv .vgrid .venue.vrow .alt{display:none}
  .p-inv .vgrid .venue.vrow{gap:4px;padding:9px 8px !important}
  .p-inv .vgrid .venue.vrow .vbtn{margin-top:2px}
  @media (max-height:760px){
    .p-inv .ilogo{width:40px}
    .p-inv .invite p{font-size:13px;line-height:1.45;margin:0 0 4px}
    .p-inv .invite .couple{font-size:17px;line-height:1.4}
    .p-inv .invite .when{margin-top:5px;font-size:14px}
    .p-inv .sched-h{font-size:15px;margin:0}
    .p-inv .inner{padding:10px 20px 10px}
    .p-inv .sc{width:38px;height:38px}
    .p-inv .sc svg{width:28px;height:28px}
    .p-inv .sicons::before{top:19px}
    .p-inv .rsvp-btn{margin:10px auto 10px !important;padding:6px 18px}
    .p-inv .vgrid .venue.vrow p{display:none}
    .p-inv .dress{margin-top:4px}
    .p-inv .dress .hashtag{margin-top:2px;font-size:13px}
    .parents2{margin-bottom:4px}
  }
  .dateline{display:flex;align-items:center;gap:10px;margin:6px 0 10px}
  .dateline span{flex:1;height:1px;background:linear-gradient(90deg,transparent,#d9b0a5)}
  .dateline span:last-child{transform:scaleX(-1)}
  .dateline b{font:500 clamp(13.5px,4vw,15.5px) 'Prompt','Jost',sans-serif;color:var(--peach-d);white-space:nowrap;letter-spacing:.3px}
  /* nav */
  .nav{display:flex;align-items:center;gap:16px;margin-top:12px;z-index:2}
  .nav button{width:42px;height:42px;border-radius:50%;border:1px solid #d9b0a5;background:rgba(255,255,255,.35);
    color:var(--peach-d);font-size:18px;cursor:pointer}
  .nav button:disabled{opacity:.35;cursor:default}
  .dots{display:flex;gap:7px}
  .dots i{width:8px;height:8px;border-radius:50%;background:#dcbcb3;transition:all .3s;cursor:pointer}
  .dots i.on{width:22px;border-radius:8px;background:var(--peach-d)}
</style>
</head>

let EMB=0;
function bloom(cls){
  const id="em"+(EMB++);
  const P=n=>+n.toFixed(1);
  let seed=11; const rnd=()=>{seed=(seed*9301+49297)%233280;return seed/233280};
  const petal=(r,w)=>`M0 0C${P(-w*.75)} ${P(-r*.22)} ${P(-w*1.05)} ${P(-r*.68)} ${P(-w*.72)} ${P(-r*.96)}L${P(-w*.4)} ${P(-r*.89)}L${P(-w*.12)} ${P(-r*1.0)}L${P(w*.14)} ${P(-r*.9)}L${P(w*.43)} ${P(-r*.99)}L${P(w*.72)} ${P(-r*.93)}C${P(w*1.05)} ${P(-r*.68)} ${P(w*.75)} ${P(-r*.22)} 0 0Z`;
  const flower=(x,y,r,rot,tilt=.72,n=8)=>{
    const w=r*.34; let g=`<g transform="translate(${x} ${y}) rotate(${rot})"><g transform="scale(1 ${tilt})">`;
    const order=[...Array(n).keys()].sort((a,b)=>Math.cos(b/n*2*Math.PI)-Math.cos(a/n*2*Math.PI));
    for(const i of order){const a=i*360/n+(rnd()-.5)*16, s2=.86+rnd()*.2;
      g+=`<g transform="rotate(${P(a)}) scale(${P(s2)})"><path d="${petal(r,w)}" fill="url(#pc${id})" stroke="#b9b9b9" stroke-width=".6"/><path d="M0 ${P(-r*.16)}Q${P(w*.06)} ${P(-r*.55)} 0 ${P(-r*.86)}" fill="none" stroke="#ffffff" stroke-width="1.1"/><path d="M${P(-w*.32)} ${P(-r*.3)}Q${P(-w*.42)} ${P(-r*.62)} ${P(-w*.3)} ${P(-r*.86)}M${P(w*.32)} ${P(-r*.3)}Q${P(w*.42)} ${P(-r*.62)} ${P(w*.3)} ${P(-r*.86)}" fill="none" stroke="#c9c9c9" stroke-width=".5"/></g>`}
    g+=`<circle r="${P(r*.2)}" fill="url(#ct${id})" stroke="#b9b9b9" stroke-width=".5"/>`;
    for(let i=0;i<16;i++){const a=i/16*Math.PI*2, d=r*.12;g+=`<circle cx="${P(Math.cos(a)*d)}" cy="${P(Math.sin(a)*d)}" r="${P(r*.03+.3)}" fill="#fff" stroke="#c4c4c4" stroke-width=".3"/>`}
    return g+`</g></g>`};
  const side=(x,y,r,rot)=>{const w=r*.36;let g=`<g transform="translate(${x} ${y}) rotate(${rot})">`;

function foodCard(f){
  const th = f.photo?`<img src="${f.photo}" alt="">`:`<svg viewBox="0 0 64 64" class="ico">${ICO[f.ico]}</svg>`;
  const link = f.url||mapURL(f.q);
  return `<div class="card row"><div class="thumb${f.photo?"":" icon"}">${th}</div>
    <div class="body"><div class="top"><h4>${esc(T(f.name))}</h4></div>
    <p>${esc(T(f.desc))}</p>
    <div class="meta">${f.tel?`<a href="${telURL(f.tel)}">📞 ${esc(f.tel)}</a>`:""}<a href="${link}" target="_blank" rel="noopener">🗺 ${esc(T(UI.directions))}</a></div></div></div>`;
}

function placeCard(p){
  return `<div class="card${p.img?" row":""}">
    ${p.img?`<div class="thumb">${p.photo?`<img src="${p.photo}" alt="">`:ART[p.img]}</div>`:""}
    <div class="body"><div class="top"><h4>${esc(T(p.name))}</h4><span class="tag ${p.type}">${esc(T(UI.tags[p.type]))}</span></div>
    <p>${esc(T(p.desc))}</p>
    <div class="meta">
      ${p.tel?`<a href="${telURL(p.tel)}">📞 ${esc(p.tel)}</a>`:""}
      <a href="${mapURL(p.q)}" target="_blank" rel="noopener">🗺 ${esc(T(UI.directions))}</a>
    </div></div></div>`;
}

const prang=(cx,by,w,h)=>{const l=cx-w/2,r=cx+w/2;let d=`<path d="M${l} ${by}L${l} ${by-h*.5}Q${l} ${by-h*.92} ${cx} ${by-h}Q${r} ${by-h*.92} ${r} ${by-h*.5}L${r} ${by}Z" fill="#fffdf9" stroke="#e3cfc4" stroke-width="1.2"/>`;

const book = document.getElementById("book"), dots = document.getElementById("dots");
const prev = document.getElementById("prev"), next = document.getElementById("next");
let cur = 0, N = 0;

function render(){ setTimeout(()=>{try{tick()}catch(e){}},0);
  const ps = pages(); N = ps.length;
  book.innerHTML = ps.join("");
  [...book.children].forEach((p,i)=>{ p.style.zIndex = N - i; if(i<cur) p.classList.add("flipped"); });
  dots.innerHTML = ps.map((_,i)=>`<i data-i="${i}" class="${i===cur?"on":""}"></i>`).join("");
  document.documentElement.lang = lang;
  document.querySelectorAll(".lang button").forEach(b=>b.classList.toggle("on", b.dataset.l===lang));
  sync();
}
function sync(){
  [...book.children].forEach((p,i)=>p.classList.toggle("flipped", i<cur));
  [...dots.children].forEach((d,i)=>d.classList.toggle("on", i===cur));
  prev.disabled = cur===0; next.disabled = cur===N-1;
}
function go(i){ cur = Math.max(0, Math.min(N-1, i)); sync(); }

prev.onclick = ()=>go(cur-1);
next.onclick = ()=>go(cur+1);
dots.onclick = e=>{ if(e.target.dataset.i) go(+e.target.dataset.i); };
book.addEventListener("click", e=>{ if(cur===0 && !e.target.closest("a")) go(1); });
document.addEventListener("keydown", e=>{ if(e.key==="ArrowRight") go(cur+1); if(e.key==="ArrowLeft") go(cur-1); });
document.querySelectorAll(".lang button").forEach(b=>b.onclick=()=>{
  lang = b.dataset.l; try{localStorage.setItem("wlang",lang)}catch(e){} render(); applyTheme();
});

let sx=0, sy=0;
book.addEventListener("touchstart", e=>{ sx=e.touches[0].clientX; sy=e.touches[0].clientY; }, {passive:true});
book.addEventListener("touchend", e=>{
  const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
  if(Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)*1.3) go(cur + (dx<0?1:-1));
}, {passive:true});

/* ===== Music: official YouTube player (Forever and Ever and Always — Ryan Mack) ===== */
const Music=(()=>{
  const au=()=>document.getElementById("bgm");
  let on=false;
  function ui(){ const b=document.getElementById("musicBtn"); if(b) b.classList.toggle("on",on); }
  function play(){ const a=au(); a.volume=0; const pr=a.play(); on=true; ui();
    let v=0; const fade=setInterval(()=>{ v=Math.min(.8,v+.05); a.volume=v; if(v>=.8) clearInterval(fade); },120);
    if(pr&&pr.catch) pr.catch(()=>{ on=false; ui(); clearInterval(fade); }); }
  function pause(){ au().pause(); on=false; ui(); }
  return { toggle(){ on?pause():play(); }, start(){ if(!on) play(); }, stop:pause, get on(){return on} };
})();
document.addEventListener("visibilitychange",()=>{ const a=document.getElementById("bgm"); if(document.hidden) a.pause(); else if(Music.on) a.play().catch(()=>{}); });
let musicStarted=false;
/* try true autoplay on load (works where the browser allows it); otherwise start on first tap */
window.addEventListener("load",()=>{ const a=document.getElementById("bgm"); a.volume=.8;
  const pr=a.play(); if(pr&&pr.then) pr.then(()=>{ if(!musicStarted){ a.pause(); a.currentTime=0; musicStarted=true; Music.start(); } }).catch(()=>{}); });
document.getElementById("musicBtn").onclick=e=>{e.stopPropagation();musicStarted=true;try{Music.toggle()}catch(err){}};
["pointerdown","touchstart","click","keydown"].forEach(ev=>document.addEventListener(ev,e=>{ if(musicStarted)return; if(e.target.closest&&e.target.closest("#musicBtn"))return; musicStarted=true; try{Music.start()}catch(_){} },{capture:true,passive:true}));

/* ===== countdown to 9 Jan 2027 18:00 (Bangkok) ===== */
const EVENT=new Date("2027-01-09T18:00:00+07:00").getTime();
function tick(){
  const el=document.getElementById("cd"); if(!el) return;
  let d=Math.max(0,EVENT-Date.now()); const v={d:Math.floor(d/864e5),h:Math.floor(d/36e5)%24,m:Math.floor(d/6e4)%60,s:Math.floor(d/1e3)%60};
  el.querySelectorAll("b").forEach(b=>{const u=b.dataset.u; b.textContent=u==="d"?v.d:String(v[u]).padStart(2,"0");});
  if(d===0){const l=document.getElementById("cdl"); if(l) l.textContent=lang==="th"?"ถึงวันงานแล้ว ♥":"It's the big day ♥";}
}
setInterval(tick,1000);


/* ===== Add to calendar ===== */
const CAL={title:"งานแต่งงาน แอม & กุ๊ก · Amm & Kook Wedding",start:"20270109T110000Z",end:"20270109T150000Z",
  loc:"ศรีสรรค์ คาเฟ่ขนมไทย (Seasand Cafe), เพชรบุรี",
  desc:"งานเลี้ยงฉลองมงคลสมรส 18:00 น. ณ ศรีสรรค์ คาเฟ่ขนมไทย\\nแผนที่: https://maps.app.goo.gl/HQQ1tSGciZHHWjpK7\\n#AMMKOOKWEDDING"};
function calLinks(){
  const g="https://calendar.google.com/calendar/render?action=TEMPLATE&text="+encodeURIComponent(CAL.title)+"&dates="+CAL.start+"/"+CAL.end+"&location="+encodeURIComponent(CAL.loc)+"&details="+encodeURIComponent(CAL.desc.replace(/\\n/g,"\n"));
  const ics=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//AmmKook//Wedding//TH","BEGIN:VEVENT","UID:ammkook-20270109@wedding","DTSTAMP:20261110T000000Z",
    "DTSTART:"+CAL.start,"DTEND:"+CAL.end,"SUMMARY:"+CAL.title,"LOCATION:"+CAL.loc.replace(/,/g,"\\,"),"DESCRIPTION:"+CAL.desc.replace(/,/g,"\\,"),
    "BEGIN:VALARM","TRIGGER:-P1D","ACTION:DISPLAY","DESCRIPTION:พรุ่งนี้งานแต่งแอม & กุ๊ก","END:VALARM","END:VEVENT","END:VCALENDAR"].join("\r\n");
  document.getElementById("rcG").href=g;
  const rcA=document.getElementById("rcA");
  if(/github\.io$/.test(location.hostname)){ rcA.href=new URL("wedding.ics",location.href).href; rcA.removeAttribute("download"); }
  else { rcA.href="data:text/calendar;charset=utf-8,"+encodeURIComponent(ics); rcA.setAttribute("download","AmmKook-Wedding.ics"); }
}
function showCal(){
  const th=lang==="th", ua=navigator.userAgent;
  const iOS=/iPad|iPhone|iPod/.test(ua)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
  const android=/Android/i.test(ua);
  calLinks();
  const g=document.getElementById("rcG"), a=document.getElementById("rcA");
  document.getElementById("rcQ").textContent=th?"เพิ่มวันงานลงในปฏิทินของคุณไหม?":"Add the wedding to your calendar?";
  a.textContent=th?"📅 เพิ่มลงปฏิทินในโทรศัพท์":"📅 Add to my phone calendar";
  g.textContent=th?"หรือเพิ่มผ่าน Google Calendar":"or use Google Calendar";
  g.classList.add("rc-alt");
  if(android){
    // opens the phone's own Calendar app with the event pre-filled (falls back to Google Calendar)
    const e=encodeURIComponent, desc=CAL.desc.replace(/\\n/g,"\n");
    a.href="intent:#Intent;action=android.intent.action.INSERT;type=vnd.android.cursor.item/event"
      +";S.title="+e(CAL.title)+";S.eventLocation="+e(CAL.loc)+";S.description="+e(desc)
      +";l.beginTime="+Date.UTC(2027,0,9,11,0)+";l.endTime="+Date.UTC(2027,0,9,15,0)
      +";S.browser_fallback_url="+e(g.href)+";end";
    a.removeAttribute("download");
  }
  document.getElementById("rcS").textContent=th?"ไว้ทีหลัง":"Maybe later";
  document.getElementById("rsvpCal").hidden=false;
  ["name","count","side"].forEach(n=>RF[n].closest("label").style.display="none"); document.getElementById("rsvpGo").style.display="none";
}
function resetRsvp(){ document.getElementById("rsvpCal").hidden=true; ["name","count","side"].forEach(n=>RF[n].closest("label").style.display=""); document.getElementById("rsvpGo").style.display=""; }

/* ===== RSVP → Google Sheet (via Google Apps Script web app) ===== */
const RSVP_URL = "https://script.google.com/macros/s/AKfycbzyPAfYaCtu3SmHnenzW3vcyYyu9TSPOn2VyyokFFRNY5l6PNN4xj3HsbmLjypDOj-HjA/exec";   // ← วาง URL ของ Google Apps Script ที่นี่ / paste the Apps Script web-app URL here
const R=document.getElementById("rsvp"), RF=document.getElementById("rsvpForm");
function rsvpText(){
  const th=lang==="th";
  document.getElementById("rsvpH").textContent=th?"ลงทะเบียนร่วมงาน":"RSVP";
  document.getElementById("rsvpSub").textContent=th?"สำหรับงานเลี้ยงฉลองช่วงเย็น 18:00 น.\nวันเสาร์ที่ 9 มกราคม 2570 · ศรีสรรค์ คาเฟ่ขนมไทย":"For the evening reception, 6:00 PM\nSaturday, 9 January 2027 · Seasand Cafe";
  document.getElementById("lName").textContent=th?"ชื่อ – นามสกุล":"Full name";
  document.getElementById("lCount").textContent=th?"จำนวนผู้ร่วมงาน (รวมตัวท่าน)":"Number of guests (including you)";
  document.getElementById("lSide").textContent=th?"แขกของฝ่าย":"Guest of";
  document.getElementById("rsvpGo").textContent=th?"ส่งข้อมูล":"Send";
  RF.count.innerHTML=Array.from({length:10},(_,i)=>`<option value="${i+1}">${i+1} ${th?"ท่าน":(i?"guests":"guest")}</option>`).join("");
  const sv=RF.side.value;
  RF.side.innerHTML=`<option value="" disabled ${sv?"":"selected"}>${th?"เลือกฝ่าย":"Choose"}</option><option value="เจ้าสาว">${th?"ฝ่ายเจ้าสาว (แอม)":"Bride (Amm)"}</option><option value="เจ้าบ่าว">${th?"ฝ่ายเจ้าบ่าว (กุ๊ก)":"Groom (Kook)"}</option>`;
  if(sv) RF.side.value=sv;
}
function openRsvp(){ resetRsvp(); rsvpText(); document.getElementById("rsvpMsg").textContent=""; R.classList.add("open"); R.setAttribute("aria-hidden","false"); setTimeout(()=>RF.name.focus(),50); }
function closeRsvp(){ R.classList.remove("open"); R.setAttribute("aria-hidden","true"); }
/* deep link from printed QR: ...?rsvp=1 or #rsvp opens the RSVP form */
window.addEventListener("load",()=>{ if(/[?&]rsvp=1/.test(location.search)||location.hash==="#rsvp"){ setTimeout(()=>{ try{ go(1); }catch(_){} setTimeout(openRsvp,700); },400); } });
document.addEventListener("click",e=>{ if(e.target.closest("[data-rsvp]")){e.preventDefault();e.stopPropagation();openRsvp();} });
R.addEventListener("click",e=>{ if(e.target===R||e.target.closest("[data-close]")) closeRsvp(); });
RF.addEventListener("submit",async e=>{
  e.preventDefault();
  const th=lang==="th", msg=document.getElementById("rsvpMsg"), go=document.getElementById("rsvpGo");
  const data={name:RF.name.value.trim(),count:RF.count.value,side:RF.side.value,lang};
  if(!data.name||!data.side){ msg.textContent=th?"กรุณากรอกข้อมูลให้ครบ":"Please fill in all fields"; return; }
  if(!RSVP_URL){ msg.textContent=th?"ระบบลงทะเบียนยังไม่เปิดใช้งาน":"RSVP is not open yet"; return; }
  go.disabled=true; msg.textContent=th?"กำลังส่ง…":"Sending…";
  try{
    await fetch(RSVP_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"application/x-www-form-urlencoded"},body:new URLSearchParams(data)});
    msg.textContent=th?`ขอบคุณค่ะ คุณ${data.name} ลงทะเบียน ${data.count} ท่านเรียบร้อยแล้ว ♥`:`Thank you, ${data.name}! ${data.count} guest(s) registered ♥`;
    try{localStorage.setItem("wrsvp",JSON.stringify(data))}catch(_){}
    RF.name.value=""; showCal();
  }catch(err){ msg.textContent=th?"ส่งไม่สำเร็จ กรุณาลองใหม่อีกครั้ง":"Could not send — please try again"; }
  go.disabled=false;
});

/* try to autoplay right away (works where the browser allows it; otherwise starts on the first touch) */
render();
applyTheme();
tick();
</script>
